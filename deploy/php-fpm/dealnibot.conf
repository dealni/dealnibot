; Pool php-fpm do DealniBot. Instalar como
; /etc/php/8.5/fpm/pool.d/dealnibot.conf.
;
; Um pool dedicado isola ambiente, socket e processos desta instalação.
[dealnibot]
user = dealnibot
group = dealnibot
listen = /run/php/php8.5-fpm-dealnibot.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; fpm:prepare deriva aliases exclusivos deste bot do EnvironmentFile.
; O drop-in carrega fpm.environment; clear_env isola os demais pools.
clear_env = yes
env[REDIS_PASSWORD] = $DEALNI_FPM_REDIS_PASSWORD
env[REDIS_HOST] = $DEALNI_FPM_REDIS_HOST
env[REDIS_PORT] = $DEALNI_FPM_REDIS_PORT
env[DEALNI_PUBLIC_BASE_URL] = $DEALNI_FPM_PUBLIC_BASE_URL
env[DEALNI_BOT_USERNAME] = $DEALNI_FPM_BOT_USERNAME

; O webhook responde antes de continuar o processamento com
; fastcgi_finish_request(); o FPM não deve matar o trabalho de fundo cedo.
; Os timeouts externos contratados do áudio somam até 365s (Telegram, download,
; transcrição, chat, fallback e uma retentativa de 429 com espera de 60s).
; A lease de 360s é renovada por fase; o teto abaixo vale só antes do ACK,
; quando o Telegram já não reentrega e nenhum catch consegue registrar a perda.
request_terminate_timeout = 330s
; O manual do PHP informa que o timeout acima deixa de valer depois de
; fastcgi_finish_request(). Fixar o default documentado evita que uma atualização
; global passe a matar o trabalho de fundo depois do ACK.
request_terminate_timeout_track_finished = no

; O padrão do FPM também permite .phar. O Nginx deste bot só encaminha quatro
; arquivos/rotas explícitos, mas esta é a defesa de segunda camada caso uma regra
; FastCGI seja adicionada no host.
security.limit_extensions = .php

; pm.status_path, pm.status_listen e ping.path ficam ausentes de propósito: não
; há página administrativa do FPM publicada pelo snippet Nginx. As sondas públicas
; /health e /ready são endpoints da aplicação, com contrato próprio.

env[DEALNI_DB_DSN] = $DEALNI_FPM_DB_DSN
env[DEALNI_DB_USER] = $DEALNI_FPM_DB_USER
env[DEALNI_DB_PASSWORD] = $DEALNI_FPM_DB_PASSWORD
; O chat do aviso ao dono (401/402 do OpenRouter). Vazio desliga o aviso.
env[DEALNI_ALERTA_CHAT_ID] = $DEALNI_FPM_ALERTA_CHAT_ID
