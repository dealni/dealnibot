# Canal adicional de correlação; contexto http, uma cópia por instância Nginx.
# Não substitui o formato nem o destino dos logs legados.
map $http_cf_ray $bots_correlacao_cf_ray {
    default "";
    "~^[A-Fa-f0-9]{16,32}-[A-Z]{3}$" $http_cf_ray;
}

# server_name é configuração do Nginx, não o cabeçalho Host recebido.
map $server_name $bots_correlacao_ativo {
    default 0;
    bot.example.com 1;
}

# IDs finitos; os demais campos vêm do Nginx. Sem URI, query, IP, UA ou corpo.
# request_id é gerado pelo Nginx, não aceito de um cabeçalho arbitrário.
log_format bots_correlacao escape=json '{"time":"$time_iso8601","server":"$server_name","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status","cf_ray":"$bots_correlacao_cf_ray","request_id":"$request_id"}';

# A extensão .log participa do glob /var/log/nginx/*.log do logrotate existente.
access_log /var/log/nginx/bots-correlacao.json.log bots_correlacao if=$bots_correlacao_ativo;
