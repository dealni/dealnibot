# nginx — substitua bot.example.com pelo domínio da instalação.
#
# Instalar como /etc/nginx/sites-available/dealnibot + symlink em
# sites-enabled. O TLS é adicionado depois pelo Certbot
# (`certbot --nginx --redirect -d bot.example.com`), que
# reescreve o listen 80 e acrescenta o bloco 443. Consulte o runbook de TLS em
# docs/OPERACAO.md antes de executar o comando: o Certbot altera o arquivo
# instalado.
#
# ATENÇÃO AO SOCKET: este vhost exige o pool isolado em
# deploy/php-fpm/dealnibot.conf. Instalar o vhost sem instalar o pool antes
# derruba o site: o `nginx -t` passa e o FPM devolve 502. Ordem correta em
# docs/OPERACAO.md.

# Canal adicional de correlação: instale antes deploy/nginx/bots-correlacao.conf
# no contexto http. Herança, TLS existente e reversão: deploy/nginx/LEIA-ME.md.

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    root /var/www/dealnibot;
    index index.php;

    server_tokens off;
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;

    # Estas rotas retornam JSON, redirecionamentos ou respostas sem corpo.
    # `always` cobre também 3xx/4xx/5xx, não apenas 2xx/3xx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # A raiz usa a mesma configuração de usuário que /index.php.
    location = / {
        rewrite ^ /index.php last;
    }

    # Todas as rotas apontam o SCRIPT_FILENAME à mão, sem o snippet de PHP do
    # Nginx: ele traz `try_files $fastcgi_script_name =404` (mata /health, que
    # não é arquivo no disco) e `fastcgi_split_path_info` (PATH_INFO que nenhum
    # entrypoint usa). O fastcgi_params oficial já define SCRIPT_NAME com
    # $fastcgi_script_name, e como as locations são exatas o valor já é o
    # caminho público.
    location = /index.php {
        # GET também autoriza HEAD; qualquer método com corpo é desnecessário
        # para uma página que só redireciona.
        limit_except GET {
            deny all;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm-dealnibot.sock;
        fastcgi_read_timeout 330s;
    }

    # Webhook raiz explicitamente publicado. O match exato encerra a procura de
    # locations; uma regex, mesmo ancorada, poderia ser sombreada por uma regex
    # futura declarada antes dela.
    location = /bot_web.php {
        # O Telegram entrega updates por POST. O gate de segredo continua no
        # PHP; esta guarda apenas rejeita métodos que nunca são válidos.
        limit_except POST {
            deny all;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/bot_web.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.5-fpm-dealnibot.sock;
        fastcgi_read_timeout 330s;
    }

    # Saúde e prontidão. São
    # duas rotas porque são duas perguntas: /health diz que o PROCESSO está de
    # pé e não toca dependência nenhuma; /ready diz que ele ATENDE e checa
    # PostgreSQL e Redis, devolvendo 503 quando um deles cai. Juntá-las faria uma
    # queda do Redis parecer processo morto.
    #
    # `access_log off` cumpre a parte do contrato que tira a sonda do log de
    # acesso: probe de minuto em minuto enche o arquivo e esconde o tráfego
    # real. O error_log continua valendo para falhas de transporte; o status
    # 503 por dependência é detalhado pelo /ready no app.log (canal `prontidao`).
    location = /health {
        limit_except GET {
            deny all;
        }
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        fastcgi_pass unix:/run/php/php8.5-fpm-dealnibot.sock;
        # O contrato da sonda é curto; não deixe uma fila de FPM transformar
        # um probe em conexão pendurada por 60 s (o default do módulo).
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 5s;
    }

    location = /ready {
        limit_except GET {
            deny all;
        }
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/ready.php;
        fastcgi_pass unix:/run/php/php8.5-fpm-dealnibot.sock;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 5s;
    }

    # Não há front controller nem try_files genérico: tudo fora da allowlist é
    # invisível, inclusive banco, certificados privados, vendor, .git, logs e
    # scripts.
    location / {
        return 404;
    }
}
