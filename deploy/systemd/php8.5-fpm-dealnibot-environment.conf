[Service]
# A origem root:dealnibot 0640 continua sendo um risco aceito para o cron;
# este derivado pertence ao root e usa 0600, pois só o mestre FPM o lê.
# Gerado do contrato pelo comando fpm:prepare, com nomes exclusivos por bot.
# Após mudar environment: fpm:prepare + restart do FPM; reload não basta.
EnvironmentFile=/etc/dealnibot/fpm.environment
